gateway:
  host: 127.0.0.1
  port: 8787
  request_timeout: 10m

backends:
  cliproxy:
    type: openai-compatible
    base_url: http://127.0.0.1:8317/v1
    api_key: ${CLIPROXY_API_KEY}
    requires_api_key: false
  openrouter:
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    requires_api_key: true
    headers:
      HTTP-Referer: http://127.0.0.1:8787
      X-Title: cxhub
  nvidia:
    type: openai-chat-compatible
    base_url: ${NVIDIA_BASE_URL}
    api_key: ${NVIDIA_API_KEY}
    requires_api_key: true
  nvidia-2:
    type: openai-chat-compatible
    base_url: ${NVIDIA_BASE_URL_2}
    api_key: ${NVIDIA_API_KEY_2}
    requires_api_key: true
profiles:
  # Profiles that declare the same non-empty `level` serve as each other's
  # fallback tier: when every target of the requested profile fails or times
  # out, same-level profiles are tried in priority order (lower `priority`
  # first, then profile name).
  #
  # `retries` is the number of full passes over the attempt list before the
  # request is reported as failed; `retry_backoff` waits between passes. Give
  # the profile you must not lose (orchestrator) the highest retry budget and
  # the lowest priority number.
  orchestrator:
    auto_tier: balanced
    level: reasoning
    priority: 0
    retries: 5
    retry_backoff: 1s
    targets:
      - backend: cliproxy
        model: YOUR_MODEL
  coder:
    level: reasoning
    priority: 10
    targets:
      - backend: cliproxy
        model: YOUR_MODEL
      # `timeout` bounds one attempt before its first meaningful output so a
      # hung upstream falls back instead of stalling the request.
      - backend: openrouter
        model: YOUR_MODEL
        timeout: 45s
  reviewer:
    auto_tier: quality
    level: reasoning
    priority: 10
    targets:
      - backend: openrouter
        model: YOUR_MODEL
  fast:
    auto_tier: speed
    level: speed
    targets:
      - backend: openrouter
        model: YOUR_MODEL
        timeout: 30s

# Requests using logical model "auto" are classified by this OpenRouter model.
# Only user text is sent for classification; a failure routes to the default.
decision:
  backend: openrouter
  model: respan/span-01-lite
  default_profile: orchestrator
  timeout: 2s

logging:
  verbose: false
