gateway:
  host: 127.0.0.1
  port: 8787
  request_timeout: 10m

backends:
  cliproxy:
    type: openai-compatible
    base_url: http://127.0.0.1:8317/v1
    api_key: ${CLIPROXY_API_KEY}
    requires_api_key: false
  openrouter:
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    requires_api_key: true
    headers:
      HTTP-Referer: http://127.0.0.1:8787
      X-Title: cxhub
  nvidia:
    type: openai-chat-compatible
    base_url: ${NVIDIA_BASE_URL}
    api_key: ${NVIDIA_API_KEY}
    requires_api_key: true
  nvidia-2:
    type: openai-chat-compatible
    base_url: ${NVIDIA_BASE_URL_2}
    api_key: ${NVIDIA_API_KEY_2}
    requires_api_key: true
profiles:
  orchestrator:
    targets:
      - backend: cliproxy
        model: YOUR_MODEL
  coder:
    targets:
      - backend: cliproxy
        model: YOUR_MODEL
      - backend: openrouter
        model: YOUR_MODEL
  reviewer:
    targets:
      - backend: openrouter
        model: YOUR_MODEL
  fast:
    targets:
      - backend: openrouter
        model: YOUR_MODEL
  nvidia/deepseek-ai/deepseek-v4-flash-0731:
    targets:
      - backend: nvidia
        model: deepseek-ai/deepseek-v4-flash-0731
      - backend: nvidia-2
        model: deepseek-ai/deepseek-v4-flash-0731

logging:
  verbose: false
